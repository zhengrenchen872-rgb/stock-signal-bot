name: run stock bot

on:
  schedule:
    - cron: "40 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Run bot
        env:
          TZ: Asia/Shanghai
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python3 bot.py
      - name: Score past signals
        env:
          TZ: Asia/Shanghai
        run: python3 bot.py --score
      - name: Commit signal log
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f signals.csv ] || { echo "no signals.csv yet"; exit 0; }
          git add signals.csv
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: signal log $(date +%F)"
          git pull --rebase && git push
