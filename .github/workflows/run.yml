name: run stock bot
on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: install packages
        run: pip install -r requirements.txt
      - name: run bot
        run: python bot.py
